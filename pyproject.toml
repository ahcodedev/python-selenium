[project]
name = "python-selenium"
description = "Selenium automation example in python"
version = "0.0.1"
requires-python = ">=3.15"

dependencies = [
    "selenium>=4.46.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "prek>=0.5.10",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "ty>=0.0.96",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "W", "I", "N", "PT", "D", "UP", "RUF", "SIM", "S", "C4", "PTH", "PL", "PERF"]  # Choose your rule categories
ignore = ["D100", "D104", "D415"]
extend-ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "PLR2004"]  # Ignore docstring (D) and assert (S101) errors in tests

[tool.ruff.format]
quote-style = "double"

[tool.uv]
required-version = ">=0.13,<0.14"
